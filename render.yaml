# Blueprint do Render: cria o serviço web do jogo.
#
# O PostgreSQL do Render permite apenas UM banco gratuito por workspace.
# Por isso este Blueprint não cria um banco novo: ele espera que a variável
# DATABASE_URL seja informada no momento do deploy (sync: false), apontando
# para um PostgreSQL existente (Render, Neon, Supabase etc.).
#
# No Render: New + Blueprint -> conecte o repositório do GitHub -> informe
# DATABASE_URL quando solicitado.

services:
  - type: web
    name: jumanji-ultima-fase
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
